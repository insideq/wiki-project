name: Metrics

on:
    schedule:
        - cron: "0 6 * * 1" # каждый понедельник в 06:00 UTC
    workflow_dispatch: # + запуск вручную

jobs:
    collect:
        name: Collect metrics
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Run tests with coverage
              run: ./gradlew test jacocoTestReport

            - name: Count commits last week
              run: |
                  echo "## Commits last 7 days" >> $GITHUB_STEP_SUMMARY
                  git log --since="7 days ago" --oneline | wc -l >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "## Last 10 commits" >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY
                  git log --oneline -10 >> $GITHUB_STEP_SUMMARY
                  echo '```' >> $GITHUB_STEP_SUMMARY

            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              with:
                  name: metrics-jacoco
                  path: build/reports/jacoco/test/html/
