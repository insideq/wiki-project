name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    lint:
        name: Lint (Checkstyle)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Run Checkstyle
              run: ./gradlew checkstyleMain checkstyleTest

            - name: Upload Checkstyle report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: checkstyle-report
                  path: build/reports/checkstyle/

    frontend-lint:
        name: Lint (ESLint)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: front
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: front/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint
              continue-on-error: true

    frontend-build:
        name: Build Frontend
        runs-on: ubuntu-latest
        needs: frontend-lint
        defaults:
            run:
                working-directory: front
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: front/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Upload frontend build
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist
                  path: front/dist/

    test:
        name: Test + Coverage (JaCoCo)
        runs-on: ubuntu-latest
        needs: lint
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Run tests with coverage
              run: ./gradlew test jacocoTestReport

            - name: Upload JaCoCo report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: jacoco-report
                  path: build/reports/jacoco/test/html/

    build:
        name: Build JAR
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Build bootJar
              run: ./gradlew bootJar -x test

            - name: Upload JAR
              uses: actions/upload-artifact@v4
              with:
                  name: wiki-jar
                  path: build/libs/*.jar
